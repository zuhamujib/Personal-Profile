<!-- My Experiences page -->
<!DOCTYPE html>
<html>

<head>
    <title>Projects</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="projects-body">
    <!-- Loading the navigation bar -->
    <div id="navbar"></div>
    <p>My Projects page is currently under construction. Please check back later for updates!</p>

    <main class="projects-page">

        <!-- Page heading -->
        <header class="projects-header">
            <p class="projects-eyebrow">SELECTIVE ENGINEERING PROJECTS</p>

            <h1>My Projects<span class="title-period">.</span></h1>
        </header>


        <!-- Projects layout -->
        <div class="projects-layout">

            <!-- Left sidebar -->
            <aside class="projects-sidebar">
                <p class="sidebar-heading">PROJECT INDEX</p>

                <nav id="projects-list" class="projects-list" aria-label="Select a project">
                    <!-- Project buttons are generated by script.js -->
                </nav>
            </aside>


            <!-- Right project details -->
            <article id="project-details" class="project-details" aria-live="polite">
                <!-- Project details are generated by script.js -->
            </article>

        </div>

    </main>

    <div id="footer"></div>

    <!-- JAVASCRIPT -->
    <script src="js/script.js"></script>

</html>
